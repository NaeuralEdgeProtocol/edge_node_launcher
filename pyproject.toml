[project]
name = "edge-node-launcher"
version = "1.1.10"
description = "Desktop launcher for managing the Ratio1 edge node container."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyQt5",
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "matplotlib",
    "pyqtgraph",
    "requests",
    "pyyaml",
    "psutil",
    "humanize",
    "ratio1>=3.5.30",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "pyinstaller",
    "pyinstaller-hooks-contrib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt5"
